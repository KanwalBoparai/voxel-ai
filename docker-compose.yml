# Local stack: Postgres plus the API.
#
#   docker compose up --build     →  http://localhost:8000
#
# This is the Postgres path, so it exercises the same driver and schema the
# hosted deploy uses rather than the SQLite fallback.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voxel
      POSTGRES_PASSWORD: voxel
      POSTGRES_DB: voxel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxel"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # Optional: .env is gitignored, so a fresh clone doesn't have one and
      # compose would otherwise refuse to start. Without it the app still boots
      # and serves every page — only the agent (ANTHROPIC_API_KEY) and the
      # Google integrations stay switched off.
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://voxel:voxel@db:5432/voxel
      # The schema is created by the command below, so skip the per-boot check.
      AUTO_CREATE_TABLES: "false"
      APP_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    # init_db.py replaces `alembic upgrade head`: this project has no alembic
    # dependency and no migration scripts. It is idempotent — create_all() only
    # adds missing tables — so it is safe on every start.
    command: >
      sh -c "python scripts/init_db.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
